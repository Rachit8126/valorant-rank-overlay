<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overlay Test Bench</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0d0f12; color: #e6e9ed; font-family: 'Segoe UI', system-ui, sans-serif; }
    main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 16px; }
    h1 { margin: 0; font-size: 22px; }
    h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #8b95a1; }
    section { background: #161a1f; border: 1px solid #252b33; border-radius: 12px; padding: 14px; }
    .stage { border-radius: 8px; padding: 16px; overflow: auto; transition: background .2s; }
    .stage.checker { background: repeating-conic-gradient(#1b1f25 0 25%, #14171c 0 50%) 0 0 / 20px 20px; }
    .stage.game { background: linear-gradient(135deg, #2b6a3b, #1d4a5e); }
    .stage.light { background: #e8e8e8; }
    .stage.dark { background: #000; }
    iframe { width: 550px; height: 200px; border: 0; display: block; background: transparent; }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button { padding: 8px 12px; border: 0; border-radius: 8px; background: #2a3038; color: #fff; font-weight: 600; cursor: pointer; }
    button:hover { filter: brightness(1.2); }
    button.win { background: #1f8f55; } button.loss { background: #b03a44; } button.up { background: #2563eb; } button.down { background: #8a4b12; }
    input, select { padding: 7px 9px; background: #0d0f12; color: inherit; border: 1px solid #2a3038; border-radius: 8px; font: inherit; }
    input[type=number] { width: 80px; }
    label { font-size: 13px; color: #aeb7c2; display: flex; align-items: center; gap: 6px; }
    .state { font-variant-numeric: tabular-nums; color: #aeb7c2; font-size: 14px; }
    #log { font: 12px/1.5 Consolas, monospace; max-height: 160px; overflow: auto; color: #8b95a1; white-space: pre-wrap; }
  </style>
</head>
<body>
<main>
  <h1>Overlay Test Bench</h1>

  <section>
    <h2>Stage</h2>
    <div class="stage checker" id="stage"><iframe id="frame" title="overlay" src="overlay.html?test=1"></iframe></div>
    <div class="btns" style="margin-top:10px">
      <label>Backdrop
        <select id="backdrop"><option value="checker">Checker</option><option value="game">Game-like</option><option value="light">Light</option><option value="dark">Black</option></select>
      </label>
      <label><input type="checkbox" id="anim" checked> Animations</label>
      <label><input type="checkbox" id="opaque" checked> Solid bg (opacity 100)</label>
      <span class="state" id="state"></span>
    </div>
  </section>

  <section>
    <h2>Match results</h2>
    <div class="btns">
      <button class="win" id="win">Win (+12…25)</button>
      <button class="loss" id="loss">Loss (−12…25)</button>
      <label>Custom RR <input type="number" id="custom" value="20"></label>
      <button id="applyCustom">Apply custom</button>
    </div>
  </section>

  <section>
    <h2>Rank changes</h2>
    <div class="btns">
      <button class="up" id="rankup">Force rank-up</button>
      <button class="down" id="derank">Force derank</button>
      <label>Jump to
        <select id="tier"></select>
      </label>
      <label>RR <input type="number" id="rr" min="0" max="100" value="50"></label>
      <button id="jump">Set (no animation)</button>
      <button id="reset">Reset</button>
    </div>
  </section>

  <section>
    <h2>Scenarios</h2>
    <div class="btns">
      <button id="s-streak">Win streak (5)</button>
      <button id="s-lose">Loss streak (5)</button>
      <button id="s-promo">Promotion run → rank-up</button>
      <button id="s-demo">Demotion run → derank</button>
      <button id="s-rapid">Rapid fire (queue test)</button>
      <button id="s-err">Show error status</button>
    </div>
  </section>

  <section>
    <h2>Log</h2>
    <div id="log"></div>
  </section>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const TIERS = ['Iron 1','Iron 2','Iron 3','Bronze 1','Bronze 2','Bronze 3','Silver 1','Silver 2','Silver 3','Gold 1','Gold 2','Gold 3','Platinum 1','Platinum 2','Platinum 3','Diamond 1','Diamond 2','Diamond 3','Ascendant 1','Ascendant 2','Ascendant 3','Immortal 1','Immortal 2','Immortal 3'];
  const ID0 = 3, MAXID = ID0 + TIERS.length - 1; // Iron 1 = 3 ... Immortal 3 = 26

  const frame = $('frame');
  TIERS.forEach((n, i) => $('tier').add(new Option(n, ID0 + i)));
  $('tier').value = 17;

  const S = { tier: 17, rr: 21, wins: 0, losses: 0, today: 0, last: null, last_change: -12 };
  const send = (m) => frame.contentWindow.postMessage(m, '*');
  const rand = () => 12 + Math.floor(Math.random() * 14);
  const log = (t) => { $('log').textContent += t + '\n'; $('log').scrollTop = 1e9; };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  const payload = () => ({
    mmr: { tierId: S.tier, tierName: TIERS[S.tier - ID0], rr: S.rr, lastChange: S.last_change },
    stats: { wins: S.wins, losses: S.losses, todayRR: S.today, lastRR: S.last },
  });
  const show = () => { $('state').textContent = `${TIERS[S.tier - ID0]} · ${S.rr} RR · ${S.wins}W-${S.losses}L · today ${S.today}`; };

  function applyDelta(d) {
    S.last = d; S.last_change = d; S.today += d;
    d > 0 ? S.wins++ : S.losses++;
    S.rr += d;
    let note = '';
    if (S.rr >= 100 && S.tier < MAXID) { S.tier++; S.rr -= 100; note = ' → RANK UP'; }
    else if (S.rr >= 100) S.rr = 99;
    else if (S.rr < 0) {
      if (S.tier > ID0) { S.tier--; S.rr = 100 + S.rr; note = ' → DERANK'; } else S.rr = 0;
    }
    log(`${d > 0 ? '+' : ''}${d} RR${note}  [${TIERS[S.tier - ID0]} ${S.rr}]`);
    send(Object.assign({ type: 'ro-render' }, payload()));
    show();
  }

  function reset() {
    S.wins = S.losses = S.today = 0; S.last = null; S.last_change = 0;
    send(Object.assign({ type: 'ro-reset' }, payload()));
    show();
    log('reset → ' + $('state').textContent);
  }

  $('win').onclick = () => applyDelta(rand());
  $('loss').onclick = () => applyDelta(-rand());
  $('applyCustom').onclick = () => applyDelta(Number($('custom').value) || 0);
  $('rankup').onclick = () => { S.rr = Math.max(S.rr, 90); applyDelta(Math.max(15, 100 - S.rr + 5)); };
  $('derank').onclick = () => { S.rr = Math.min(S.rr, 8); applyDelta(-18); };
  $('jump').onclick = () => {
    S.tier = Number($('tier').value); S.rr = Math.max(0, Math.min(100, Number($('rr').value) || 0));
    reset();
  };
  $('reset').onclick = () => { S.tier = 17; S.rr = 21; reset(); };

  async function run(deltas, gap) { for (const d of deltas) { applyDelta(d); await sleep(gap); } }
  $('s-streak').onclick = () => run([18, 20, 16, 22, 19], 2500);
  $('s-lose').onclick = () => run([-15, -17, -14, -20, -13], 2500);
  $('s-promo').onclick = async () => { S.rr = 70; reset(); await sleep(1200); await run([20, 18], 5500); };
  $('s-demo').onclick = async () => { S.rr = 25; reset(); await sleep(1200); await run([-18, -16], 5500); };
  $('s-rapid').onclick = () => run([10, -12, 15, -11, 20, 25], 150);
  $('s-err').onclick = () => { send({ type: 'ro-status', msg: 'Rate limited' }); setTimeout(() => send({ type: 'ro-status', msg: '' }), 3000); log('status shown for 3s'); };

  $('backdrop').onchange = (e) => { $('stage').className = 'stage ' + e.target.value; };
  function style() { send({ type: 'ro-style', cfg: { anim: $('anim').checked, opacity: $('opaque').checked ? 100 : 40 } }); }
  $('anim').onchange = style; $('opaque').onchange = style;

  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'ro-ready') { style(); send(Object.assign({ type: 'ro-reset' }, payload())); show(); log('overlay ready'); }
  });
})();
</script>
</body>
</html>
